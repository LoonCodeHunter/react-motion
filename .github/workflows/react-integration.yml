name: React consumer compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: React ${{ matrix.react }} / SSR + TS JSX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - name: Pack the exact source under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kovari-consumer"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/kovari-consumer" --silent
          cp scripts/react-ssr-smoke.mjs scripts/react-typecheck.tsx scripts/react-tsconfig.json "$RUNNER_TEMP/kovari-consumer/"
      - name: Install official React runtime/types in isolated consumer
        shell: bash
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kovari-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          TARBALL="$(find . -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm install --no-audit --no-fund --ignore-scripts "./${TARBALL#./}" \
            "react@$REACT_MAJOR" "react-dom@$REACT_MAJOR" \
            "@types/react@$REACT_MAJOR" "@types/react-dom@$REACT_MAJOR" typescript@6
          node react-ssr-smoke.mjs
          ./node_modules/.bin/tsc -p react-tsconfig.json
