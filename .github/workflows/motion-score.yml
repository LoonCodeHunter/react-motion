name: Motion Score

on:
  push:
    branches: [main]
    paths-ignore:
      # Updating only the badge JSON must not create an infinite workflow loop.
      - motion-score.json
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

# Browser benchmark code has no write token. Only update-score can push the
# measured, schema-validated score JSON to the repository.
permissions:
  contents: read

concurrency:
  group: motion-score-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark the latest published npm release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install an isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .motion-score-run
          cd .motion-score-run
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund @kovari/react-motion@latest vite playwright
          npx playwright install --with-deps chromium
          cp ../scripts/motion-score/index.html ./index.html
          cp ../scripts/motion-score/bench.js ./bench.js
          cp ../scripts/motion-score/core.mjs ./motion-score-core.mjs
          cp ../scripts/motion-score/score-runner.mjs ./score-runner.mjs

      - name: Run browser benchmark and calculate 0–100 score
        shell: bash
        run: |
          set -euo pipefail
          cd .motion-score-run
          npx vite --host 127.0.0.1 --port 4173 > vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            kill "$VITE_PID" 2>/dev/null || true
            wait "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              echo "Vite benchmark server is ready (attempt ${attempt})."
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat vite.log
            echo 'Vite benchmark server did not start within 30 seconds.' >&2
            exit 1
          fi
          node score-runner.mjs

      - name: Validate Shields endpoint JSON and score bounds
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const score = JSON.parse(await readFile('motion-score.json', 'utf8'));
          const colours = new Set(['red', 'yellow', 'green', 'yellowgreen']);
          if (score.schemaVersion !== 1) throw new Error('Unsupported Motion Score schemaVersion.');
          if (score.package !== '@kovari/react-motion') throw new Error('Unexpected package name in score JSON.');
          if (!Number.isInteger(score.score) || score.score < 0 || score.score > 100) throw new Error('Score must be an integer from 0 to 100.');
          if (score.message !== `${score.score}/100`) throw new Error('Badge message does not match the numeric score.');
          if (!colours.has(score.color)) throw new Error(`Unexpected badge colour: ${score.color}`);
          if (!score.packageVersion || !score.generatedAt || !score.metrics || !score.components) throw new Error('Score JSON is missing benchmark metadata.');
          for (const key of ['frameScore', 'springScore', 'motionValueScore', 'animationTimingScore']) {
            const value = score.components[key];
            if (!Number.isInteger(value) || value < 0 || value > 100) throw new Error(`Invalid component score: ${key}`);
          }
          console.log(`Validated Motion Score ${score.score}/100 (${score.color}) for package ${score.packageVersion}.`);
          NODE

      - name: Upload the score and raw measurements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kovari-react-motion-score
          path: motion-score.json
          if-no-files-found: error
          retention-days: 30

  update-score:
    name: Update the public score badge data
    needs: benchmark
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download the measured score
        uses: actions/download-artifact@v4
        with:
          name: kovari-react-motion-score
          path: .score-artifact

      - name: Validate and stage the score JSON
        shell: bash
        run: |
          set -euo pipefail
          test -f .score-artifact/motion-score.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile('.score-artifact/motion-score.json', 'utf8'));
          const colours = new Set(['red', 'yellow', 'green', 'yellowgreen']);
          if (data.schemaVersion !== 1 || data.package !== '@kovari/react-motion') throw new Error('Unexpected Motion Score schema/package.');
          if (!Number.isInteger(data.score) || data.score < 0 || data.score > 100) throw new Error('Motion Score must be an integer from 0 to 100.');
          if (data.message !== `${data.score}/100` || !colours.has(data.color)) throw new Error('Invalid badge message or colour.');
          if (!data.packageVersion || !data.generatedAt || !data.metrics || !data.components) throw new Error('Incomplete benchmark output.');
          NODE
          cp .score-artifact/motion-score.json motion-score.json

      - name: Commit changed score data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motion-score.json
          if git diff --cached --quiet; then
            echo 'Score JSON is unchanged; no commit is needed.'
            exit 0
          fi
          git commit -m 'chore(motion-score): update measured score [skip ci]'
          git push origin HEAD:main
